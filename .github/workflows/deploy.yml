name: Deploy dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/grome_vps_key
          chmod 600 ~/.ssh/grome_vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/grome_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/grom-dashboard-source
          git fetch origin master
          git reset --hard origin/master

          # Copy application code only. Runtime data and secrets stay on the VPS.
          rsync -a server.js adapter.js agent.js telegram_bot.js index.html master-mobile-current.html package.json package-lock.json logo_v2.png favicon.png favicon.ico /root/grom-dashboard/
          rsync -a --include='*/' --include='*.js' --exclude='*' routes/ /root/grom-dashboard/routes/
          rsync -a --include='*/' --include='*.js' --include='*.css' --exclude='*' public/ /root/grom-dashboard/public/

          cd /root/grom-dashboard
          npm install --omit=dev
          pm2 restart grom-server --update-env
          pm2 restart grom-agent --update-env
          pm2 save
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          REMOTE
