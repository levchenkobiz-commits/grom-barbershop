name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_REMOTE_ROOT: ${{ secrets.VPS_REMOTE_ROOT || '/root/grom-dashboard' }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      IVIDEON_LOGIN: ${{ secrets.IVIDEON_LOGIN }}
      IVIDEON_PASSWORD: ${{ secrets.IVIDEON_PASSWORD }}
      VIDEO_AUDIT_INTERNAL_TOKEN: ${{ secrets.VIDEO_AUDIT_INTERNAL_TOKEN }}
      IVIDEON_CAPTURE_INTERVAL_MIN: ${{ secrets.IVIDEON_CAPTURE_INTERVAL_MIN || '1' }}
      IVIDEON_CAPTURE_START: ${{ secrets.IVIDEON_CAPTURE_START || '08:55' }}
      IVIDEON_CAPTURE_END: ${{ secrets.IVIDEON_CAPTURE_END || '23:00' }}
      IVIDEON_CAPTURE_TIMEZONE: ${{ secrets.IVIDEON_CAPTURE_TIMEZONE || 'Europe/Moscow' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check server.js
          node --check routes/router.js
          node --check routes/video_audit.js
          node --check routes/manager.js
          node --check public/js/analytics.js
          node --check public/js/analytics_history_overlay.js
          node --check ivideon_screenshot_worker.js

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Create verified predeploy backup
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "/usr/local/sbin/grom-backup predeploy"

      - name: Remove legacy ChatGPT video auditor
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "pm2 delete grom-video-auditor-1 grom-video-auditor-2 grom-video-auditor-3 grom-video-auditor-4 >/dev/null 2>&1 || true; pm2 save >/dev/null; rm -rf /root/grome-video-auditor"

      - name: Upload manifest files only
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_REMOTE_ROOT'"
          rsync -az --relative \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            --files-from=deploy-manifest.txt \
            ./ "$VPS_USER@$VPS_HOST:$VPS_REMOTE_ROOT/"

      - name: Ensure Node supports SQLite
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "if ! node -e \"require('node:sqlite')\" >/dev/null 2>&1; then npm install -g n && n 24.15.0; fi; hash -r; node -v; node -e \"require('node:sqlite')\""

      - name: Install and restart
        run: |
          set -euo pipefail
          SERVER_ENV=$(printf 'VIDEO_AUDIT_INTERNAL_TOKEN=%q' "$VIDEO_AUDIT_INTERNAL_TOKEN")
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_REMOTE_ROOT' && npm install --omit=dev && NODE_BIN=\$(command -v node) && (pm2 delete grom-server >/dev/null 2>&1 || true) && $SERVER_ENV PORT=8080 pm2 start server.js --name grom-server --interpreter \"\$NODE_BIN\" --update-env && pm2 save && for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done; exit 1"

      - name: Start Ivideon screenshot worker
        run: |
          set -euo pipefail
          if [ -z "$VIDEO_AUDIT_INTERNAL_TOKEN" ] || [ -z "$IVIDEON_LOGIN" ] || [ -z "$IVIDEON_PASSWORD" ]; then
            echo "Ivideon worker secrets are not set; skipping worker start."
            exit 0
          fi

          WORKER_ENV=$(printf 'VIDEO_AUDIT_INTERNAL_TOKEN=%q IVIDEON_LOGIN=%q IVIDEON_PASSWORD=%q VIDEO_AUDIT_BASE_URL=%q IVIDEON_CAPTURE_INTERVAL_MIN=%q IVIDEON_CAPTURE_START=%q IVIDEON_CAPTURE_END=%q IVIDEON_CAPTURE_TIMEZONE=%q' \
            "$VIDEO_AUDIT_INTERNAL_TOKEN" "$IVIDEON_LOGIN" "$IVIDEON_PASSWORD" "http://127.0.0.1:8080" "$IVIDEON_CAPTURE_INTERVAL_MIN" "$IVIDEON_CAPTURE_START" "$IVIDEON_CAPTURE_END" "$IVIDEON_CAPTURE_TIMEZONE")

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_REMOTE_ROOT' && node node_modules/playwright/cli.js install chromium >/dev/null && if pm2 describe grom-video-audit-screenshots >/dev/null 2>&1; then $WORKER_ENV pm2 restart grom-video-audit-screenshots --update-env; else $WORKER_ENV pm2 start ivideon_screenshot_worker.js --name grom-video-audit-screenshots --update-env; fi && pm2 save"
