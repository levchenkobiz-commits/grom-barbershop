<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROME Видеоаудит</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1b1b1b;
      --line: #2b2b2b;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --accent: #e8ff38;
      --bad: #ff4d4d;
      --ok: #38d996;
      --warn: #ffc247;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: #0f0f0f;
    }
    .brand { font-weight: 800; font-size: 18px; }
    .brand span { color: var(--accent); }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn:hover { border-color: #555; }
    .btn.primary { background: var(--accent); color: #050505; border-color: var(--accent); }
    .btn.good { background: rgba(56,217,150,.15); color: var(--ok); border-color: rgba(56,217,150,.35); }
    .btn.bad { background: rgba(255,77,77,.14); color: var(--bad); border-color: rgba(255,77,77,.35); }
    .btn.warn { background: rgba(255,194,71,.14); color: var(--warn); border-color: rgba(255,194,71,.35); }
    .layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      min-height: calc(100vh - 64px);
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #101010;
      overflow: auto;
      max-height: calc(100vh - 64px);
    }
    .filters {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      gap: 10px;
      padding: 16px;
      background: #101010;
      border-bottom: 1px solid var(--line);
    }
    select, input, textarea {
      width: 100%;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .event {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      background: transparent;
    }
    .event:hover, .event.active { background: #191919; }
    .event-title { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
    .event-meta { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #262626;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .pill.sent { color: var(--bad); background: rgba(255,77,77,.13); }
    .pill.ok { color: var(--ok); background: rgba(56,217,150,.13); }
    .content {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      background: #090909;
    }
    .viewer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0;
    }
    .image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      padding: 18px;
      border-right: 1px solid var(--line);
    }
    .image-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 170px);
      object-fit: contain;
      border-radius: 8px;
      background: #000;
    }
    .details {
      padding: 18px;
      overflow: auto;
      border-bottom: 1px solid var(--line);
    }
    .details h1 { margin: 0 0 10px; font-size: 22px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; margin: 18px 0; font-size: 14px; }
    .kv div:nth-child(odd) { color: var(--muted); }
    .summary {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .review {
      display: grid;
      gap: 12px;
      padding: 18px;
      background: #101010;
    }
    .review-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .training-bar {
      display: grid;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #0f0f0f;
    }
    .training-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .training-import { display: none; gap: 10px; }
    .training-import.active { display: grid; }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .login-card {
      width: min(420px, 100%);
      display: grid;
      gap: 12px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .empty { padding: 40px; color: var(--muted); text-align: center; }
    @media (max-width: 980px) {
      .layout, .viewer { grid-template-columns: 1fr; }
      .sidebar { max-height: 360px; border-right: 0; border-bottom: 1px solid var(--line); }
      .image-wrap { border-right: 0; border-bottom: 1px solid var(--line); }
      .review-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="login" class="login">
    <form class="login-card" id="login-form">
      <div class="brand">GROME <span>Видеоаудит</span></div>
      <input id="login-input" autocomplete="username" placeholder="Логин">
      <input id="password-input" autocomplete="current-password" type="password" placeholder="Пароль">
      <button class="btn primary" type="submit">Войти</button>
      <div id="login-error" class="event-meta"></div>
    </form>
  </div>

  <main id="app" style="display:none">
    <header class="topbar">
      <div class="brand">GROME <span>Видеоаудит</span></div>
      <div class="toolbar">
        <span id="stats" class="event-meta"></span>
        <button class="btn" id="refresh-btn" type="button">Обновить</button>
        <button class="btn" id="export-training-btn" type="button">Export training</button>
        <button class="btn" id="show-import-btn" type="button">Import</button>
      </div>
    </header>

    <section class="layout">
      <aside class="sidebar">
        <div class="filters">
          <select id="status-filter">
            <option value="pending">Только новые</option>
            <option value="all">Все</option>
            <option value="confirmed">Подтвержденные</option>
            <option value="false_positive">Ошибки</option>
            <option value="uncertain">Сомнительные</option>
          </select>
        </div>
        <div id="event-list"></div>
      </aside>

      <section class="content">
        <div class="viewer">
          <div class="image-wrap" id="image-wrap"><div class="empty">Выберите проверку слева</div></div>
          <aside class="details" id="details"></aside>
        </div>
        <form class="review" id="review-form">
          <input id="master-name" placeholder="Имя мастера, если известно">
          <textarea id="review-note" placeholder="Комментарий"></textarea>
          <div class="review-actions">
            <button class="btn good" data-verdict="confirmed" type="submit">Да, нарушение</button>
            <button class="btn bad" data-verdict="false_positive" type="submit">Ошибка</button>
            <button class="btn warn" data-verdict="uncertain" type="submit">Сомнительно</button>
          </div>
        <section class="training-bar">
          <div id="training-stats" class="event-meta">Training memory: loading</div>
          <div class="training-import" id="training-import">
            <textarea id="training-jsonl" placeholder="Paste grome-video-audit-training JSONL here"></textarea>
            <div class="training-actions">
              <button class="btn primary" id="import-training-btn" type="button">Import training</button>
              <button class="btn" id="hide-import-btn" type="button">Close</button>
            </div>
          </div>
        </section>
        </form>
      </section>
    </section>
  </main>

  <script>
    const state = { user: null, key: '', events: [], selected: null };

    function savedUser() {
      try { return JSON.parse(localStorage.getItem('grome_user') || 'null'); } catch { return null; }
    }

    function userKey() {
      const user = savedUser();
      return user && (user.key || user.tg_id || user.id) ? String(user.key || user.tg_id || user.id) : '';
    }

    async function api(url, options = {}) {
      const headers = new Headers(options.headers || {});
      if (state.key) headers.set('X-User-Key', state.key);
      if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) throw new Error(await response.text());
      return response;
    }

    function showApp() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    function showLogin(message = '') {
      document.getElementById('app').style.display = 'none';
      document.getElementById('login').style.display = 'grid';
      document.getElementById('login-error').textContent = message;
    }

    async function loadEvents() {
      const status = document.getElementById('status-filter').value;
      const response = await api(`/api/video-audit/events?status=${encodeURIComponent(status)}&limit=200`);
      const data = await response.json();
      state.events = data.events || [];
      document.getElementById('stats').textContent = `${state.events.length} кейсов`;
      renderList();
      if (!state.selected && state.events[0]) selectEvent(state.events[0].id);
      await loadTrainingStats().catch(() => {});
    }

    async function loadTrainingStats() {
      const response = await api('/api/video-audit/training');
      const data = await response.json();
      const stats = data.stats || {};
      const el = document.getElementById('training-stats');
      if (el) {
        el.textContent = `Training memory: ${stats.total || 0} labels | confirmed ${stats.confirmed || 0} | errors ${stats.false_positive || 0} | uncertain ${stats.uncertain || 0}`;
      }
      return data;
    }

    async function exportTraining() {
      const response = await api('/api/video-audit/training/export');
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'grome-video-audit-training.jsonl';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function importTraining() {
      const textarea = document.getElementById('training-jsonl');
      const jsonl = textarea ? textarea.value.trim() : '';
      if (!jsonl) return;
      const response = await api('/api/video-audit/training/import', {
        method: 'POST',
        body: JSON.stringify({ jsonl }),
      });
      const data = await response.json();
      if (textarea) textarea.value = '';
      const panel = document.getElementById('training-import');
      if (panel) panel.classList.remove('active');
      await loadTrainingStats();
      alert(`Imported ${data.imported || 0} records`);
    }

    function renderList() {
      const list = document.getElementById('event-list');
      if (!state.events.length) {
        list.innerHTML = '<div class="empty">Новых кейсов нет</div>';
        return;
      }
      list.innerHTML = state.events.map(event => {
        const a = event.analysis || {};
        const active = state.selected && state.selected.id === event.id ? ' active' : '';
        const sent = event.notified ? '<span class="pill sent">отправлено</span>' : '<span class="pill">не отправлено</span>';
        const status = event.status !== 'pending' ? `<span class="pill ok">${event.status}</span>` : '<span class="pill">new</span>';
        return `<button class="event${active}" data-id="${event.id}">
          <span class="event-title"><span>${event.cameraName || ''}</span>${sent}</span>
          <span class="event-meta">${event.checkedAtMoscow || ''} · ${Math.round(Number(a.confidence || 0) * 100)}% · ${(a.type || []).join(', ')}</span>
          <span>${status}</span>
        </button>`;
      }).join('');
      list.querySelectorAll('.event').forEach(btn => btn.addEventListener('click', () => selectEvent(btn.dataset.id)));
    }

    async function selectEvent(id) {
      state.selected = state.events.find(event => event.id === id);
      renderList();
      const event = state.selected;
      if (!event) return;
      const a = event.analysis || {};
      document.getElementById('details').innerHTML = `
        <h1>${event.cameraName || ''}</h1>
        <div class="kv">
          <div>Проверка</div><div>${event.checkedAtMoscow || ''}</div>
          <div>Плеер</div><div>${event.playerClock || '-'}</div>
          <div>Тип</div><div>${(a.type || []).join(', ') || '-'}</div>
          <div>Уверенность</div><div>${Math.round(Number(a.confidence || 0) * 100)}%</div>
          <div>Модель</div><div>${a.model || '-'}</div>
          <div>Токены</div><div>${a.usage ? `${a.usage.prompt_tokens || 0} + ${a.usage.completion_tokens || 0}` : '-'}</div>
          <div>Статус</div><div>${event.status || 'pending'}</div>
        </div>
        <div class="summary">${escapeHtml(`${a.summary || ''}\n\n${a.evidence || ''}`).trim()}</div>
      `;
      document.getElementById('master-name').value = (event.review && event.review.masterName) || a.masterName || '';
      document.getElementById('review-note').value = (event.review && event.review.note) || '';
      await loadFrame(event);
    }

    async function loadFrame(event) {
      const wrap = document.getElementById('image-wrap');
      wrap.innerHTML = '<div class="empty">Загружаю кадр</div>';
      const response = await api(`/api/video-audit/frame?id=${encodeURIComponent(event.id)}`);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      wrap.innerHTML = `<img src="${url}" alt="Кадр видеоаудита">`;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: document.getElementById('login-input').value,
            password: document.getElementById('password-input').value,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Ошибка входа');
        const stored = { ...data.user, key: data.key };
        localStorage.setItem('grome_user', JSON.stringify(stored));
        state.user = stored;
        state.key = data.key;
        if (stored.role !== 'owner') return showLogin('Раздел доступен только владельцу');
        showApp();
        await loadEvents();
      } catch (error) {
        showLogin(error.message);
      }
    });

    document.getElementById('status-filter').addEventListener('change', () => {
      state.selected = null;
      loadEvents().catch(error => showLogin(error.message));
    });
    document.getElementById('refresh-btn').addEventListener('click', () => loadEvents().catch(error => alert(error.message)));
    document.getElementById('export-training-btn').addEventListener('click', () => exportTraining().catch(error => alert(error.message)));
    document.getElementById('show-import-btn').addEventListener('click', () => {
      const panel = document.getElementById('training-import');
      if (panel) panel.classList.add('active');
    });
    document.getElementById('hide-import-btn').addEventListener('click', () => {
      const panel = document.getElementById('training-import');
      if (panel) panel.classList.remove('active');
    });
    document.getElementById('import-training-btn').addEventListener('click', () => importTraining().catch(error => alert(error.message)));
    document.getElementById('review-form').addEventListener('submit', async event => {
      event.preventDefault();
      const submitter = event.submitter;
      if (!state.selected || !submitter) return;
      await api('/api/video-audit/events', {
        method: 'PATCH',
        body: JSON.stringify({
          id: state.selected.id,
          verdict: submitter.dataset.verdict,
          masterName: document.getElementById('master-name').value,
          note: document.getElementById('review-note').value,
        }),
      });
      state.selected = null;
      await loadEvents();
    });

    (async function init() {
      const user = savedUser();
      state.user = user;
      state.key = userKey();
      if (!user || !state.key) return showLogin();
      if (user.role !== 'owner') return showLogin('Раздел доступен только владельцу');
      showApp();
      try {
        await loadEvents();
      } catch (error) {
        showLogin('Нужен повторный вход');
      }
    })();
  </script>
</body>
</html>
