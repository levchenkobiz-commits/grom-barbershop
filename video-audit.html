<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GROME Видеоаудит</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#070707; --panel:#141414; --panel2:#1b1b1b; --line:#303030;
      --text:#f4f4f4; --muted:#a0a0a0; --accent:#dfff3f;
      --green:#31d889; --red:#ff5f5f; --yellow:#ffd35a; --blue:#65a7ff;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,Arial,sans-serif; }
    header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#0c0c0c; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
    main { display:grid; grid-template-columns:360px 1fr 380px; min-height:calc(100vh - 60px); }
    aside, .right { border-color:var(--line); padding:14px; overflow:auto; max-height:calc(100vh - 60px); }
    aside { border-right:1px solid var(--line); }
    .right { border-left:1px solid var(--line); }
    .center { padding:16px; overflow:auto; }
    button, input, select, textarea { font:inherit; border:1px solid var(--line); background:#101010; color:var(--text); border-radius:8px; padding:10px 12px; }
    button { cursor:pointer; font-weight:800; }
    textarea { min-height:80px; resize:vertical; }
    label { display:grid; gap:6px; font-size:12px; color:var(--muted); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .stack { display:grid; gap:10px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; cursor:pointer; }
    .card.active { outline:2px solid var(--blue); }
    .muted { color:var(--muted); font-size:12px; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; background:#272727; color:#ddd; }
    .ok { color:var(--green); } .warn { color:var(--yellow); } .bad { color:var(--red); }
    .green { background:#0f3323; border-color:#1f7a50; color:var(--green); }
    .red { background:#351414; border-color:#7d2828; color:var(--red); }
    .yellow { background:#342910; border-color:#806321; color:var(--yellow); }
    .blue { background:#11243e; border-color:#295b9a; color:#8cc0ff; }
    .stage { background:#020202; border:1px solid var(--line); border-radius:8px; min-height:520px; display:flex; align-items:center; justify-content:center; position:relative; overflow:auto; }
    canvas { max-width:100%; height:auto; display:block; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
    .split2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .small { font-size:12px; padding:7px 9px; }
    @media (max-width: 1100px) {
      main { grid-template-columns:1fr; }
      aside, .right { max-height:none; border:0; border-bottom:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div><b>GROME <span style="color:var(--accent)">Видеоаудит</span></b> <span class="badge">разметка CV</span></div>
    <div class="row">
      <span id="health" class="muted">загрузка...</span>
      <button onclick="loadAll()">Обновить</button>
      <button onclick="exportDataset()">Export dataset</button>
    </div>
  </header>

  <main>
    <aside>
      <div class="stack panel" style="margin-bottom:12px">
        <div class="split2">
          <label>Статус
            <select id="filterStatus" onchange="loadCases()">
              <option value="">Все</option>
              <option value="candidate">candidate</option>
              <option value="pending_review">pending_review</option>
              <option value="reviewed">reviewed</option>
              <option value="needs_more_data">needs_more_data</option>
              <option value="exported">exported</option>
            </select>
          </label>
          <label>Филиал
            <select id="filterBranch" onchange="loadCases()"></select>
          </label>
        </div>
        <button onclick="createCase()">+ Новый кейс</button>
      </div>
      <div id="cases"></div>
    </aside>

    <section class="center">
      <div id="empty" class="panel muted">Выбери кейс или создай новый. Здесь сохраняются кадры, bbox, роли, мастер/identity, решение ревью и экспорт датасета.</div>
      <div id="workspace" style="display:none" class="stack">
        <div class="row" style="justify-content:space-between">
          <div>
            <h2 id="caseTitle" style="margin:0"></h2>
            <div id="caseMeta" class="muted"></div>
          </div>
          <span id="caseStatus" class="badge"></span>
        </div>
        <div class="stage">
          <canvas id="canvas"></canvas>
        </div>
        <div class="row">
          <input id="fileInput" type="file" accept="image/*" onchange="uploadEvidence()">
          <button class="blue" onclick="enableBoxMode()">Разметить человека bbox</button>
          <button onclick="clearDraftBox()">Сбросить bbox</button>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="stack panel">
        <h3 style="margin:0">Кейс / решение</h3>
        <label>Филиал
          <select id="branchSelect" onchange="syncCameraOptions()"></select>
        </label>
        <label>Камера
          <select id="cameraSelect"></select>
        </label>
        <label>Тип нарушения
          <select id="labelSelect"></select>
        </label>
        <label>Мастер / identity
          <select id="identitySelect"></select>
        </label>
        <div class="row">
          <input id="newIdentityName" placeholder="Новый мастер">
          <button class="small" onclick="createIdentity()">Добавить</button>
        </div>
        <label>Комментарий
          <textarea id="comment"></textarea>
        </label>
        <div class="row">
          <button class="green" onclick="review('violation')">Да, нарушение</button>
          <button class="red" onclick="review('error')">Ошибка</button>
          <button class="yellow" onclick="review('uncertain')">Сомнительно</button>
        </div>
      </div>

      <div class="stack panel" style="margin-top:12px">
        <h3 style="margin:0">Person bbox</h3>
        <div id="boxInfo" class="muted">Нет bbox. Нажми кнопку разметки и выдели человека на кадре.</div>
        <label>Роль
          <select id="roleSelect">
            <option value="master">master</option>
            <option value="client">client</option>
            <option value="person">person</option>
          </select>
        </label>
        <button onclick="savePersonAnnotation()">Сохранить person annotation</button>
      </div>

      <div class="stack panel" style="margin-top:12px">
        <h3 style="margin:0">Annotations</h3>
        <div id="annotations" class="muted">Нет</div>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/video-audit';
    let boot = null;
    let cases = [];
    let selected = null;
    let image = null;
    let boxMode = false;
    let dragStart = null;
    let draftBox = null;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function userKey() {
      try {
        const user = JSON.parse(localStorage.getItem('grome_user') || '{}');
        if (user && user.key) return user.key;
      } catch {}
      return localStorage.getItem('tg_id') || '';
    }

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      const key = userKey();
      if (key) headers.set('X-User-Key', key);
      if (options.json) {
        headers.set('Content-Type', 'application/json; charset=utf-8');
        options.body = JSON.stringify(options.json);
      }
      const res = await fetch(API + path, Object.assign({}, options, {headers}));
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadAll() {
      boot = await api('/bootstrap');
      document.getElementById('health').textContent = 'online';
      fillSelect('labelSelect', boot.violationClasses.map(x => [x, x]));
      fillSelect('branchSelect', boot.branches.map(b => [b.id, b.name]));
      fillSelect('filterBranch', [['', 'Все']].concat(boot.branches.map(b => [b.id, b.name])));
      fillSelect('identitySelect', [['', 'Не задан']].concat(boot.identities.map(i => [i.id, i.display_name])));
      syncCameraOptions();
      await loadCases();
    }

    function fillSelect(id, rows) {
      document.getElementById(id).innerHTML = rows.map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`).join('');
    }

    function syncCameraOptions() {
      const branchId = document.getElementById('branchSelect').value;
      const cams = boot.cameras.filter(c => c.branch_id === branchId);
      fillSelect('cameraSelect', cams.map(c => [c.id, c.name]));
    }

    async function loadCases() {
      const qs = new URLSearchParams();
      const status = document.getElementById('filterStatus').value;
      const branch = document.getElementById('filterBranch').value;
      if (status) qs.set('status', status);
      if (branch) qs.set('branch_id', branch);
      cases = await api('/cases' + (qs.toString() ? '?' + qs.toString() : ''));
      document.getElementById('cases').innerHTML = cases.map(c => `
        <div class="card ${selected?.id === c.id ? 'active' : ''}" onclick="selectCase('${c.id}')">
          <b>${escapeHtml(c.branch?.name || c.branch_id || 'Филиал')}</b>
          <span class="badge">${escapeHtml(c.status)}</span>
          <div class="muted">${escapeHtml(c.source_time || '')}</div>
          <div>${escapeHtml(c.human_label || c.predicted_type || 'no label')} ${Math.round((c.predicted_confidence || 0) * 100)}%</div>
          <div class="muted">${escapeHtml(c.identity?.display_name || '')}</div>
        </div>
      `).join('');
    }

    async function createCase() {
      const payload = {
        branch_id: document.getElementById('branchSelect').value,
        camera_id: document.getElementById('cameraSelect').value,
        predicted_type: document.getElementById('labelSelect').value,
        predicted_confidence: 0,
        model_name: 'manual_candidate',
        source_kind: 'manual',
        comment: document.getElementById('comment').value || null
      };
      selected = await api('/cases', {method:'POST', json: payload});
      await loadCases();
      renderSelected();
    }

    async function selectCase(caseId) {
      selected = await api('/cases/' + caseId);
      renderSelected();
      await loadCases();
    }

    function renderSelected() {
      document.getElementById('empty').style.display = 'none';
      document.getElementById('workspace').style.display = 'grid';
      document.getElementById('caseTitle').textContent = selected.branch?.name || selected.id;
      document.getElementById('caseMeta').textContent = `${selected.camera?.name || ''} · ${selected.source_time || ''}`;
      document.getElementById('caseStatus').textContent = selected.status;
      document.getElementById('comment').value = selected.comment || '';
      document.getElementById('labelSelect').value = selected.human_label || selected.predicted_type || boot.violationClasses[0];
      document.getElementById('identitySelect').value = selected.assigned_identity_id || '';
      document.getElementById('annotations').innerHTML = selected.annotations.length
        ? selected.annotations.map(a => `<div>${escapeHtml(a.label)} ${escapeHtml(a.role || '')} ${escapeHtml(identityName(a.identity_id) || '')}</div>`).join('')
        : '<span class="muted">Нет</span>';
      draftBox = null;
      loadImage();
    }

    function identityName(id) {
      return boot.identities.find(i => i.id === id)?.display_name || id || '';
    }

    async function loadImage() {
      image = null;
      const ev = selected.evidence?.[0];
      if (!ev) {
        canvas.width = 900; canvas.height = 520;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#777'; ctx.font = '20px Arial';
        ctx.fillText('Загрузи кадр / скриншот', 30, 50);
        return;
      }
      image = new Image();
      image.onload = () => {
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        redraw();
      };
      image.src = `${API}/evidence/${ev.id}?t=${Date.now()}`;
    }

    function redraw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if (image) ctx.drawImage(image, 0, 0);
      for (const ann of selected.annotations || []) drawBox(ann, '#65a7ff');
      if (draftBox) drawBox(draftBox, '#dfff3f');
    }

    function drawBox(b, color) {
      if (b.x == null) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, canvas.width / 500);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = color;
      ctx.font = `${Math.max(14, canvas.width / 80)}px Arial`;
      ctx.fillText(b.role || b.label || 'person', b.x + 4, Math.max(18, b.y - 6));
    }

    function canvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.round((evt.clientX - rect.left) * canvas.width / rect.width),
        y: Math.round((evt.clientY - rect.top) * canvas.height / rect.height)
      };
    }

    canvas.addEventListener('mousedown', e => {
      if (!boxMode) return;
      dragStart = canvasPoint(e);
    });
    canvas.addEventListener('mousemove', e => {
      if (!boxMode || !dragStart) return;
      const p = canvasPoint(e);
      draftBox = {
        label: 'person',
        x: Math.min(dragStart.x, p.x),
        y: Math.min(dragStart.y, p.y),
        w: Math.abs(p.x - dragStart.x),
        h: Math.abs(p.y - dragStart.y)
      };
      document.getElementById('boxInfo').textContent = `x:${draftBox.x} y:${draftBox.y} w:${draftBox.w} h:${draftBox.h}`;
      redraw();
    });
    canvas.addEventListener('mouseup', () => { dragStart = null; boxMode = false; });

    function enableBoxMode() { boxMode = true; }
    function clearDraftBox() { draftBox = null; redraw(); }

    async function uploadEvidence() {
      if (!selected) return alert('Сначала создай кейс');
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;
      const headers = {'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name)};
      const key = userKey();
      if (key) headers['X-User-Key'] = key;
      const res = await fetch(`${API}/cases/${selected.id}/evidence`, {
        method:'POST',
        headers,
        body: await file.arrayBuffer()
      });
      if (!res.ok) throw new Error(await res.text());
      selected = await api('/cases/' + selected.id);
      renderSelected();
      await loadCases();
    }

    async function savePersonAnnotation() {
      if (!selected || !draftBox) return alert('Нет bbox');
      const identity = document.getElementById('identitySelect').value || null;
      const ev = selected.evidence?.[0];
      await api(`/cases/${selected.id}/annotations`, {
        method:'POST',
        json:{
          evidence_id: ev?.id || null,
          label: 'person',
          shape: 'bbox',
          x: draftBox.x, y: draftBox.y, w: draftBox.w, h: draftBox.h,
          identity_id: identity,
          role: document.getElementById('roleSelect').value,
          meta: { image_width: canvas.width, image_height: canvas.height }
        }
      }).then(async ann => {
        const crop = await makeCropBlob(draftBox);
        if (crop) {
          const key = userKey();
          await fetch(`${API}/annotations/${ann.id}/crop`, {
            method:'POST',
            headers:Object.assign({'Content-Type':'image/jpeg'}, key ? {'X-User-Key': key} : {}),
            body: crop
          });
        }
      });
      selected = await api('/cases/' + selected.id);
      renderSelected();
    }

    function makeCropBlob(box) {
      if (!image || !box || box.w < 4 || box.h < 4) return Promise.resolve(null);
      const off = document.createElement('canvas');
      off.width = Math.max(1, Math.round(box.w));
      off.height = Math.max(1, Math.round(box.h));
      const octx = off.getContext('2d');
      octx.drawImage(image, box.x, box.y, box.w, box.h, 0, 0, off.width, off.height);
      return new Promise(resolve => off.toBlob(resolve, 'image/jpeg', 0.92));
    }

    async function createIdentity() {
      const name = document.getElementById('newIdentityName').value.trim();
      if (!name) return;
      await api('/identities', {method:'POST', json:{display_name:name, branch_id:document.getElementById('branchSelect').value || null}});
      document.getElementById('newIdentityName').value = '';
      await loadAll();
    }

    async function review(verdict) {
      if (!selected) return;
      selected = await api(`/cases/${selected.id}/review`, {
        method:'POST',
        json:{
          verdict,
          label: document.getElementById('labelSelect').value,
          identity_id: document.getElementById('identitySelect').value || null,
          comment: document.getElementById('comment').value || null
        }
      });
      renderSelected();
      await loadCases();
    }

    async function exportDataset() {
      const out = await api('/dataset/export', {method:'POST', json:{format:'grome-jsonl', includeStatuses:['reviewed','needs_more_data']}});
      alert(`Export готов: ${out.path}\nКейсов: ${out.casesCount}`);
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    loadAll().catch(e => {
      document.getElementById('health').textContent = 'error';
      alert(e.message);
    });
  </script>
</body>
</html>
